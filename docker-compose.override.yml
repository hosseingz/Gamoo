version: '3.9'

services:

  app:
    volumes:
      - ./backend:/src

  celery_worker:
    volumes:
      - ./backend:/src

  celery_beat:
    volumes:
      - ./backend:/src

  frontend:
    volumes:
      - ./frontend:/app
      - node_modules_data:/app/node_modules
      - next_data:/app/.next
    environment:
      - NODE_ENV=development

volumes:
  node_modules_data:
  next_data:
