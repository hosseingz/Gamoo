# Configuration for rate limiting
limit_req_zone $binary_remote_addr zone=mylimit:500m rate=50r/s;
limit_req_status 429;

log_format upstreamlog '$server_name to: $upstream_addr [$request] '
    'upstream_response_time $upstream_response_time '
    'msec $msec request_time $request_time';

upstream django {
    server django-app:8000;
}

upstream nextjs {
    server nextjs-frontend:3000;
}

server {
    listen 80;

    client_max_body_size 5m;
    
    # 1. Next.js WebSockets (HMR) - Kept for development
    location /_next/webpack-hmr {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 2. Static files (CRITICAL FIX)
    # Using '^~' forces Nginx to prioritize this over any Regex match.
    # Now, any URL starting with /static/ will stop searching further.
    location ^~ /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Media files (CRITICAL FIX)
    location ^~ /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Django Admin, API, and custom backend paths
    # Now this Regex won't accidentally steal requests meant for /static/admin/
    location ~ ^/(admin|api)/ {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://django;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_set_header Referer $http_referer;
        proxy_set_header Cookie $http_cookie;
        # Cleaned up WebSocket headers here unless your API strictly needs them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. Standard requests to Next.js frontend
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Necessary for Next.js features like SSR and WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}