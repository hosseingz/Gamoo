version: '3.9'

x-shared-env: &shared-environment
  env_file:
    - .env

x-default-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"


services:

  app:
    build: 
      context: ./backend
    container_name: django-app
    <<: *shared-environment
    expose:
      - "8000"
    volumes:
      - ./backend:/src
      - static:/src/static
      - media:/src/media
    depends_on:
      - database
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  celery_worker:
    build:
      context: ./backend
    container_name: celery_worker
    <<: *shared-environment
    entrypoint: [ "celery", "-A", "config", "worker", "--loglevel=info" ]
    volumes:
      - ./backend:/src
      - static:/src/static
      - media:/src/media
    depends_on:
      - database
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery_beat:
    build:
      context: ./backend
    container_name: celery_beat
    <<: *shared-environment
    entrypoint: [ "celery", "-A", "config", "beat", "--loglevel=info" ]
    volumes:
      - ./backend:/src
    depends_on:
      - database
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  frontend:
    build:
      context: ./frontend
    container_name: nextjs-frontend
    volumes:
    # - ./frontend:/app
    - node_modules_data:/app/node_modules
    # - next_data:/app/.next
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=
      - INTERNAL_API_BASE_URL=http://django-app:8000
    depends_on:
      - app
    <<: *default-logging

  database:
    image: postgres:15.4
    expose:
      - "5432"
    container_name: "${POSTGRES_HOST}"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - psql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    volumes:
      - static:/static
      - media:/media
    ports:
      - "8080:80"
    depends_on:
      - app
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  psql-data:
  redis-data:
  static:
  media:
  node_modules_data:
  # next_data: